        function comparer(index) {

        function reload() {
            $.ajax({
                beforeSend: function(request) {
                    request.setRequestHeader("x-api-key", 'QkmjCRYvXt6o89UdZAvoXa49543NxOtU2tBhQQDQ');
                },
                dataType: "json",
                url: 'https://8e304x2wjg.execute-api.ap-east-1.amazonaws.com/test/obcs-data-exchanges',
                success: function(data) {
                    // Define station sequence
                    const stationSequence = [
                        49, // TUM
                        48, // SIH
                        47, // TIS
                        46, // LOP
                        45, // YUL
                        44, // KSR
                        43, // TWW
                        42, // MEF
                        41, // NAC
                        50, // AUS
                        14, // ETS
                        1,  // HUH
                        61, // HOM
                        62, // TKW
                        63, // SUW
                        64, // KAT
                        65, // DIH
                        66, // HIK
                        21, // TAW
                        22, // CKT
                        23, // STW
                        24, // CIO
                        25, // SHM
                        26, // TSH
                        27, // HEO
                        28, // MOS
                        29  // WKS
                    ];

                    // Get selected stations
                    const selectedStations = Array.from($('#stationFilter').val() || []);
                    
                    // Filter station sequence based on selection
                    const filteredStations = selectedStations.includes('all') ? 
                        stationSequence : 
                        stationSequence.filter(code => selectedStations.includes(code.toString()));

                    // Create separate maps for upline and downline trains
                    let uplineMap = new Map();
                    let downlineMap = new Map();
                    
                    // Initialize all stations for both directions
                    filteredStations.forEach(code => {
                        uplineMap.set(code, []);
                        downlineMap.set(code, []);
                    });
                    
                    // Calculate timestamp threshold (2 minutes ago)
                    const twoMinutesAgo = Date.now() - (2 * 60 * 1000);
                    
                    // Group trains by their next station and direction
                    $.each(data.Items, function (key, value) {
                        // Check if train data is recent enough (within last 2 minutes)
                        const trainTimestamp = parseInt(value.receivedTime);
                        if (isNaN(trainTimestamp) || trainTimestamp < twoMinutesAgo) {
                            return; // Skip outdated trains
                        }

                        if (value.isInService || $('#hideUnknown')[0].checked == false) {
                            let direction = covertStationOrder(value.currentStationCode) < covertStationOrder(value.destinationStationCode) ? "up" : "down";
                            
                            if ((direction == "up" && !$('#up_dir')[0].checked) || (direction == "down" && !$('#dn_dir')[0].checked)) {
                                return;
                            }
                            
                            let nextStation = value.nextStationCode;
                            if (direction === "up" && uplineMap.has(nextStation)) {
                                uplineMap.get(nextStation).push(value);
                            } else if (direction === "down" && downlineMap.has(nextStation)) {
                                downlineMap.get(nextStation).push(value);
                            }
                        }
                    });
                    
                    // Build table HTML
                    let tableContent = '';
                    
                    // Upline Section (reversed order)
                    if ($('#up_dir')[0].checked) {
                        tableContent += `
                            <tr>
                                <td colspan="2" style="background-color: #f0f0f0; text-align: center;">
                                    <h3>Upline Trains</h3>
                                </td>
                            </tr>`;
                        
                        // Show filtered stations in reversed sequence for upline
                        [...filteredStations].reverse().forEach(stationCode => {
                            const trains = uplineMap.get(stationCode);
                            tableContent += `<tr>
                                <td><strong>${mapStation(stationCode)}</strong></td>
                                <td>${trains && trains.length > 0 ? buildTrainList(trains) : 'No trains'}</td>
                            </tr>`;
                        });
                    }
                    
                    // Downline Section (original order)
                    if ($('#dn_dir')[0].checked) {
                        tableContent += `
                            <tr>
                                <td colspan="2" style="background-color: #f0f0f0; text-align: center;">
                                    <h3>Downline Trains</h3>
                                </td>
                            </tr>`;
                        
                        // Show filtered stations in original sequence for downline
                        filteredStations.forEach(stationCode => {
                            const trains = downlineMap.get(stationCode);
                            tableContent += `<tr>
                                <td><strong>${mapStation(stationCode)}</strong></td>
                                <td>${trains && trains.length > 0 ? buildTrainList(trains) : 'No trains'}</td>
                            </tr>`;
                        });
                    }
                    
                    $('#trainContent').empty().append(tableContent);
                }
            });
        }

        // Helper function to build train list HTML
        function buildTrainList(trains) {
            let trainHtml = '';
            trains.forEach(train => {
                let lastUpdated = 'Unknown';
                try {
                    const timestamp = parseInt(train.receivedTime);
                    if (!isNaN(timestamp)) {
                        lastUpdated = new Date(timestamp).toLocaleString();
                    }
                } catch (error) {
                    console.error('Error parsing timestamp:', error);
                }
                
                // Determine direction based on current and destination stations
                const isDownline = covertStationOrder(train.currentStationCode) > covertStationOrder(train.destinationStationCode);
                
                trainHtml += `
                    <div class="train-container">
                        <div class="train-info">
                            <div class="train-id">Train ${train.trainId} (${train.train_type})</div>
                            <div class="train-status">
                                <div class="status-item">
                                    <i class="fas fa-map-marker-alt"></i>
                                    From: ${mapStation(train.currentStationCode)} → To: ${mapStation(train.destinationStationCode)}
                                </div>
                                <div class="status-item">
                                    <i class="fas fa-arrow-right"></i>
                                    Next: ${mapStation(train.nextStationCode)}
                                </div>
                            </div>
                            <div class="train-status">
                                <div class="status-item">
                                    <i class="fas fa-tachometer-alt"></i>
                                    Speed: ${train.trainSpeed}km/h
                                </div>
                                <div class="status-item">
                                    <i class="fas fa-door-${train.isDoorOpen ? 'open' : 'closed'}"></i>
                                    Doors: ${train.isDoorOpen ? "Open" : "Closed"}
                                </div>
                                <div class="status-item">
                                    <i class="fas fa-clock"></i>
                                    Updated: ${lastUpdated}
                                </div>
                            </div>
                        </div>
                        <div class="car-loads">`;
                
                // Get cars array and reverse it for downline trains
                let cars = [...train.listCars];
                if (isDownline) {
                    cars.reverse();
                }
                
                cars.forEach((car, idx) => {
                    let loadLevel = parseInt(car.passengerCount);
                    let color = loadLevel < 120 ? '#4CAF50' : 
                               loadLevel < 230 ? '#FFC107' : '#F44336';
                    
                    // Determine load icons and class
                    let loadIcons = '';
                    let loadClass = '';
                    if (loadLevel < 120) {
                        loadIcons = '<i class="fas fa-user"></i>';
                        loadClass = 'light-load';
                    } else if (loadLevel < 230) {
                        loadIcons = '<i class="fas fa-user"></i><i class="fas fa-user"></i>';
                        loadClass = 'moderate-load';
                    } else {
                        loadIcons = '<i class="fas fa-user"></i><i class="fas fa-user"></i><i class="fas fa-user"></i>';
                        loadClass = 'heavy-load';
                    }
                    
                    let carNumber = isDownline ? 8 - idx : idx + 1;
                    
                    trainHtml += `
                        <div class="car-load-indicator" style="background-color: ${color};">
                            <div class="car-number">Car ${carNumber}</div>
                            <div class="load-level">${car.passengerCount}</div>
                            <div class="load-icons ${loadClass}">${loadIcons}</div>
                        </div>`;
                });
                
                trainHtml += `</div></div>`;
            });
            return trainHtml;
        }

        function ToInteger(x) {
            x = Number(x);
            return x < 0 ? Math.ceil(x) : Math.floor(x);
        }

        function modulo(a, b) {
            return a - Math.floor(a/b)*b;
        }
        function ToUint8(x) {
            return modulo(ToInteger(x), Math.pow(2, 8));
        }

        function decimalToHexString(number)
        {
          if (number < 0)
          {
            number = 0xFF + number + 1;
          }

          return number.toString(16).toUpperCase();
        }

        function toBinary(a) { //: String
            var r = '';
            var binCounter = 0;
            while (a > 0) {
                r = a%2 + r;
                a = Math.floor(a/2);
            }
            return r;
        }


        function twoscompl(a) { //: int
            var l = toBinaryFill(a).length;
            var msb = a >>> (l-1);

            if (msb == 0) {
                return a;
            }

            a = a-1;
            var str = toBinary(a);
            var nstr = '';
            for (var i = 0; i < str.length; i++) {
                nstr += str.charAt(i) == '1' ? '0' : '1';
            }
            return (-1)*parseInt(nstr);
        }

                case 63: return 13;
                case 64: return 12;
                case 65: return 11;
                case 66: return 10;
                default: return 0;
            }
        }
    </script>

</head>

    <section>
        <h1 class="text-center"><img src="roctec.jpeg" style="width: 80px;height: 80px" /></h1>
        <h1>TML Train Load Viewer</h1>
        
        <div class="control-row">
            <div class="control-item">
                <input type="text" id="searchInput" placeholder="Filter by Car Number" class="form-control"/>
            </div>
            
            <div class="control-item">
                <select id="stationFilter" class="form-control" multiple size="8">
                    <option value="all" selected>All Stations</option>

                    <option value="48">SIH</option>

                    <option value="46">LOP</option>
                    <option value="45">YUL</option>
                    <option value="44">KSR</option>
                    <option value="43">TWW</option>
                    <option value="42">MEF</option>
                    <option value="41">NAC</option>
                    <option value="50">AUS</option>
                    <option value="14">ETS</option>
                    <option value="1">HUH</option>
                    <option value="61">HOM</option>
                    <option value="62">TKW</option>
                    <option value="63">SUW</option>
                    <option value="64">KAT</option>
                    <option value="65">DIH</option>
                    <option value="66">HIK</option>
                    <option value="21">TAW</option>
                    <option value="22">CKT</option>
                    <option value="23">STW</option>
                    <option value="24">CIO</option>
                    <option value="25">SHM</option>
                    <option value="26">TSH</option>
                    <option value="27">HEO</option>
                    <option value="28">MOS</option>
                    <option value="29">WKS</option>
                </select>

            <div class="control-item">
                <div class="checkbox-group">
                    <button type="button" id="reload" class="btn btn-primary" onClick="reload();">Reload</button>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" checked id="hideUnknown" name="hide_unknown"/>
                    <label for="hideUnknown">Hide Not in Service Trains</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" checked id="up_dir" name="up_dir"/>
                    <label for="up_dir">Show Up Direction</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" checked id="dn_dir" name="dn_dir"/>
                    <label for="dn_dir">Show Down Direction</label>
                </div>
            </div>
        </div>

        <!-- Wrap table in responsive container -->
        <div class="table-responsive">
            <table id='table' class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>Station</th>
                        <th>Trains</th>
                    </tr>
                </thead>
                <tbody id="trainContent">
                </tbody>
            </table>
        </div>

        <script src="table_search.js"></script>

        <script>

            $(document).ready(function () {

                reload();

                $('th').click(function(){
                    var table = $(this).parents('table').eq(0)
                    var rows = table.find('tr:gt(0)').toArray().sort(comparer($(this).index()))
                    this.asc = !this.asc
                    if (!this.asc){rows = rows.reverse()}
                    for (var i = 0; i < rows.length; i++){table.append(rows[i])}
                })

                $('#searchInput').keyup(function () {

                  table_search($('#searchInput').val(),$('#table tbody tr'),'0');

                });

                // Handle "All Stations" selection
                $('#stationFilter').change(function() {
                    const selectedOptions = $(this).val() || [];
                    if (selectedOptions.includes('all')) {
                        // If "All Stations" is selected, deselect other options
                        $(this).find('option:not([value="all"])').prop('selected', false);
                    } else if (selectedOptions.length === 0) {
                        // If nothing is selected, select "All Stations"
                        $(this).find('option[value="all"]').prop('selected', true);
                    } else {
                        // If other stations are selected, deselect "All Stations"
                        $(this).find('option[value="all"]').prop('selected', false);
                    }
                    reload();
                });

            });

            window.setInterval("reload()",6000);

        </script>
    </section>
