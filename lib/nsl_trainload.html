       function comparer(index) {
           return function(a, b) {
               var valA = getCellValue(a, index), valB = getCellValue(b, index);

       function ToInteger(x) {
           x = Number(x);
           return x < 0 ? Math.ceil(x) : Math.floor(x);
       }

       function modulo(a, b) {
           return a - Math.floor(a/b)*b;
       }
       function ToUint8(x) {
           return modulo(ToInteger(x), Math.pow(2, 8));
       }

       function decimalToHexString(number)
       {
         if (number < 0)
         {
           number = 0xFF + number + 1;
         }

         return number.toString(16).toUpperCase();
       }

       function toBinary(a) { //: String
           var r = '';
           var binCounter = 0;
           while (a > 0) {
               r = a%2 + r;
               a = Math.floor(a/2);
           }
           return r;
       }


       function twoscompl(a) { //: int
           var l = toBinaryFill(a).length;
           var msb = a >>> (l-1);

           if (msb == 0) {
               return a;
           }

           a = a-1;
           var str = toBinary(a);
           var nstr = '';
           for (var i = 0; i < str.length; i++) {
               nstr += str.charAt(i) == '1' ? '0' : '1';
           }
           return (-1)*parseInt(nstr);
       }

       function mapStation(code) {
           switch (code) {

               case '91': return 'HTD';
               case '92': return 'HTD';
               case '81': return 'TEST';
               case '82': return 'TEST';
