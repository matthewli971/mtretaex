<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <!-- Clock circle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3a86d4" stroke-width="20" opacity="0.8" />
  <!-- Train body: 200w x 210h, centred -->
  <rect x="156" y="148" width="200" height="200" rx="20" fill="#4a90d9" />
  <!-- Roof arch -->
  <path d="M178 148 Q256 112 334 148" fill="#3a7bc8" />
  <!-- Windshield — two split panes with centre nose, taller -->
  <rect x="172" y="168" width="64" height="100" rx="9" fill="#c8e6ff" opacity="0.92" />
  <rect x="276" y="168" width="64" height="100" rx="9" fill="#c8e6ff" opacity="0.92" />
  <!-- Centre nose divider -->
  <rect x="240" y="168" width="32" height="90" rx="0" fill="#4a90d9" />
  <!-- Dark bar with white rounded rect headlights -->
  <rect x="172" y="280" width="168" height="26" rx="6" fill="#1a2a4a" />
  <rect x="182" y="285" width="40" height="16" rx="6" fill="#ffffff" opacity="0.95" />
  <rect x="290" y="285" width="40" height="16" rx="6" fill="#ffffff" opacity="0.95" />
  <!-- Bumper / undercarriage -->
  <rect x="163" y="358" width="186" height="12" rx="5" fill="#2a4a7a" />
  <!-- Rail/track -->
  <rect x="148" y="380" width="216" height="6" rx="3" fill="#666" />
  <!-- Pantograph -->
  <line x1="256" y1="126" x2="256" y2="102" stroke="#aaa" stroke-width="4" stroke-linecap="round" />
  <line x1="234" y1="99" x2="278" y2="99" stroke="#aaa" stroke-width="4" stroke-linecap="round" />
  <!-- Clock hands centred at (256,256) -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="#fff" stroke-width="15" stroke-linecap="round" />
  <line x1="256" y1="256" x2="340" y2="256" stroke="#fff" stroke-width="15" stroke-linecap="round" />
  <circle cx="256" cy="256" r="15" fill="#fff" />
</svg>
