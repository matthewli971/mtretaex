<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>地下鐵到站時間關注組</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MTR ETA">
    <link rel="apple-touch-icon" id="apple-touch-icon-link" href="logo.svg">
    <script>
    // iOS requires a PNG for the home-screen icon; SVG is not supported.
    // Generate a PNG from the SVG via canvas and update the apple-touch-icon link.
    (function () {
        var sizes = [180, 152, 120];
        function buildIcon(size) {
            var canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext('2d');
            var img = new Image();
            img.onload = function () {
                // Solid background in case SVG has transparent areas
                ctx.fillStyle = '#1a2a4a';
                ctx.fillRect(0, 0, size, size);
                ctx.drawImage(img, 0, 0, size, size);
                var dataUrl = canvas.toDataURL('image/png');
                if (size === 180) {
                    var link = document.getElementById('apple-touch-icon-link');
                    if (link) link.href = dataUrl;
                }
                // Add additional size links
                var extra = document.createElement('link');
                extra.rel = 'apple-touch-icon';
                extra.setAttribute('sizes', size + 'x' + size);
                extra.href = dataUrl;
                document.head.appendChild(extra);
            };
            img.src = 'logo.svg';
        }
        sizes.forEach(buildIcon);
    })();
    </script>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="sticky-header-group">
    <!-- Header -->
    <div id="header">
        <div id="header-left">
            <span id="app-title">地下鐵到站時間關注組</span>
            <span id="app-version"></span>
        </div>
        <div id="header-right">
            <div id="clock"></div>
            <div id="last-update-times">
                <div class="update-time-col">
                    <span id="last-update-time">--:--:--</span>
                    <span class="update-time-label">ETA</span>
                </div>
                <div class="update-time-col update-time-trainload">
                    <span id="line-api-time">--:--:--</span>
                    <span class="update-time-label">Trainload</span>
                </div>
            </div>
            <div id="action-group">
                <div id="header-refresh-indicator">
                    <!-- Spinning circle (loader) -->
                    <div class="header-loader-spinner hidden"></div>
                    <!-- Green tick -->
                    <svg class="header-tick hidden" viewBox="0 0 24 24" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <button id="btn-settings" title="Settings" aria-label="Settings" onclick="toggleSettingsPanel()">
                    <svg viewBox="0 0 24 24" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12 3.61 3.61 0 0 1 12 8.4a3.61 3.61 0 0 1 3.6 3.6 3.61 3.61 0 0 1-3.6 3.6z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-pwa-install" class="hidden" title="Download App" aria-label="Install App">
                    <svg viewBox="0 0 24 24" width="1em" height="1em" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-refresh">F5</button>
            </div>
        </div>
    </div>

    <!-- Station Selector -->
    <div id="station-selector">
        <div id="search-wrapper">
            <div id="station-display" class="hidden" onclick="toggleStationList()">
                <span id="station-display-badge"></span>
                <span id="station-display-name"></span>
            </div>
            <input type="text" id="station-search" placeholder="搜尋車站" onclick="toggleStationList()" oninput="filterStationList()">
            <span id="search-line-dots"></span>
            <div id="station-dropdown" class="hidden">
                <div id="station-list"></div>
            </div>
        </div>
    </div>

    <!-- Station Info Bar -->
    <div id="station-info-bar" class="hidden">
        <div id="station-info-row1">
            <span id="station-info-name"></span>
            <a id="station-call-btn" class="station-call-btn hidden" href="#" title="" aria-label="Call station">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.24 1.01l-2.2 2.2z"/></svg>玩
            </a>
            <span id="btn-show-all" onclick="showAllLines()">顯示全部</span>
        </div>
        <div id="station-info-filter"></div>
    </div>
    </div><!-- /sticky-header-group -->

    <!-- CORS Warning Banner (shown only when loaded via file://) -->
    <div id="cors-warning" class="hidden">
        <span id="cors-warning-text">⚠ 本頁從本地檔案開啟，部分列車資料 API (Trainload) 因 CORS 限制無法載入。請使用網頁伺服器開啟（如 VS Code Live Server）。</span>
        <button id="cors-warning-close" onclick="this.parentNode.classList.add('hidden')" aria-label="Close">✕</button>
    </div>

    <!-- ETA Main Content -->
    <div id="eta-container"></div>

    <!-- Loading Overlay -->
    <div id="loader" class="hidden">
        <div class="loader-spinner"></div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-overlay" class="hidden" onclick="closeSettingsPanel()"></div>
    <div id="settings-panel" class="hidden">
        <div class="settings-header">
            <span class="settings-title">設定</span>
            <button class="settings-close" onclick="closeSettingsPanel()" aria-label="Close settings">&times;</button>
        </div>
        <div class="settings-body">
            <div class="settings-item">
                <span class="settings-item-label">背景顏色</span>
                <div id="settings-theme-group" class="settings-theme-toggle" onclick="settingsToggleTheme()">
                    <button class="sun-btn" type="button" aria-label="Light mode">
                        <svg class="sun-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
                            <line x1="12" y1="5.5" x2="12" y2="2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <line x1="16.6" y1="7.4" x2="18.7" y2="5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <line x1="18.5" y1="12" x2="21.5" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <line x1="16.6" y1="16.6" x2="18.7" y2="18.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <line x1="12" y1="18.5" x2="12" y2="21.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <line x1="7.4" y1="16.6" x2="5.3" y2="18.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <line x1="5.5" y1="12" x2="2.5" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <line x1="7.4" y1="7.4" x2="5.3" y2="5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button class="theme-btn" type="button" aria-label="Dark mode">
                        <svg class="theme-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="settings-item">
                <span class="settings-item-label">到站時間預報模式</span>
                <div class="settings-mode-buttons" role="group" aria-label="到站時間預報模式">
                    <button type="button" class="settings-mode-button" data-mode="1" onclick="settingsSetMode('D')">D</button>
                    <button type="button" class="settings-mode-button" data-mode="2" onclick="settingsSetMode('I')">I</button>
                </div>
            </div>
            <div class="settings-item">
                <span class="settings-item-label">超闊螢幕行數顯示</span>
                <div class="settings-mode-buttons settings-wide-buttons" role="group" aria-label="超闊螢幕行數顯示">
                    <button type="button" class="settings-mode-button settings-wide-mode-button" data-mode="2" onclick="settingsSetSuperWideMode('2')">2</button>
                    <button type="button" class="settings-mode-button settings-wide-mode-button" data-mode="4" onclick="settingsSetSuperWideMode('4')">4</button>
                </div>
            </div>
            <div class="settings-item">
                <span class="settings-item-label">視覺化車站顯示</span>
                <label class="settings-switch settings-switch-viz">
                    <input type="checkbox" id="settings-viz-input" onchange="settingsToggleViz()">
                    <span class="settings-switch-slider" data-on="I" data-off="O"></span>
                </label>
            </div>
            
            <div id="settings-viz-category" style="display: flex; flex-direction: column; gap: 18px; margin-left: 16px; margin-top: -8px; border-left: 2px solid var(--color-border); padding-left: 12px;">
                <div class="settings-item">
                    <span class="settings-item-label">動態箭咀顯示</span>
                    <label class="settings-switch">
                        <input type="checkbox" id="settings-viz-arrow-input" onchange="settingsToggleVizArrow()">
                        <span class="settings-switch-slider" data-on="I" data-off="O"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
